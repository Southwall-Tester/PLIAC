<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识图谱讲义</title>
<script src="/static/theme.js?v=28"></script><link rel="stylesheet" href="/static/theme.css?v=1"><link rel="stylesheet" href="/static/margin-reader.css?v=7">
<script defer src="/static/vendor/g6-5.1.1.min.js"></script><script defer src="/static/vendor/pixi-8.19.0.min.js"></script><script defer src="/static/network-layout.js?v=29"></script><script defer src="/static/graph-encoding.js?v=27"></script><script defer src="/static/network-pixi.js?v=27"></script><script defer src="/static/network-view.js?v=29"></script><script defer src="/static/margin-practice.js?v=1"></script><script defer src="/static/margin-reader.js?v=9"></script></head>
<body><header><a href="/courses">课程</a><button id="mapMode" aria-pressed="true">知识图谱</button><button id="readMode" aria-pressed="false">完整讲义</button><button id="exerciseMode" aria-pressed="false">单元练习</button><a id="practiceLink">课程学习记录</a><button id="themeButton">深色</button></header>
<main><nav id="scopeBreadcrumb"><a id="parentScope" href="/courses">返回上一级</a><span id="scopeTitle"></span></nav><h1 id="title">正在打开讲义</h1><p id="error" role="alert" hidden></p><section id="generationControls"><label>课程范围 <select id="chapter"><option value="">整门课程</option></select></label><label id="sectionChoice" hidden>目录单元 <select id="scopeSection"><option value="">整章</option></select></label><label>知识点 <select id="scopeNode"><option value="">当前范围全部知识点</option></select></label><button id="generate">生成图谱、讲义与习题</button><button id="cancelJob" hidden>取消生成</button><span id="jobStatus" role="status"></span><div id="courseExperiments"></div></section><div id="scopePrerequisites" hidden></div><p id="scopeEmpty" hidden>这个范围尚未生成学习单元。点击“生成图谱、讲义与习题”开始。</p><label id="versionChoice" hidden>已有版本 <select id="unitVersion"></select></label><p id="snapshotSummary" hidden></p><section id="graphScreen" hidden><div class="graph-panel"><div class="graph-tools"><input id="search" type="search" placeholder="查找知识点" aria-label="查找知识点"><button id="fit">适应画布</button></div><p id="graphNotice" hidden></p><div id="graph" aria-label="讲义概念关系图"></div><div class="concept-list-heading"><span>知识点</span><span id="conceptCount" role="status"></span></div><div id="conceptList" aria-label="知识点列表"></div><p id="conceptEmpty" hidden>没有匹配的知识点，请更换搜索词。</p></div><aside id="detail"><h2 id="conceptTitle">内容总览</h2><p id="definition"></p><button id="studyConcept" hidden>单独学习这个知识点</button><div id="relationships"></div><div id="sectionLinks"></div><div id="conceptSources"></div><details id="evidence" hidden><summary>查看关系依据</summary><p id="quote"></p></details></aside></section>
<section id="readingScreen" hidden><nav><button data-section="overview">内容总览</button><div id="outline"></div><button data-section="answers">参考答案</button><button data-section="review">复习与来源</button></nav><div class="handout-content"><div class="handout-toolbar"><span>本单元讲义</span><a id="pdfDownload">下载 PDF</a></div><iframe id="lessonFrame" title="LearnMargin 详细讲义"></iframe></div></section>
<section id="exerciseScreen" hidden><div class="practice-toolbar"><h2>单元练习</h2><label>学习编号 <input id="practiceStudent" maxlength="80" pattern="[A-Za-z0-9_-]+"></label><button id="loadPractice">读取记录</button><span id="practiceProgress" role="status"></span></div><p id="practiceStatus" role="status"></p><div id="practiceQuestions"></div></section></main>
<dialog id="sourceDialog"><header><h2 id="sourceTitle">原材料</h2><button id="closeSource">返回讲义</button></header><div id="sourceContent"></div></dialog></body></html>
