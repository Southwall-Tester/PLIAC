<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · PLIAC</title>
  <script src="/static/theme.js?v=28"></script>
  <link rel="stylesheet" href="/static/theme.css?v=1">
  <link rel="stylesheet" href="/static/login.css?v=2">
  <link rel="stylesheet" href="/static/login-theme.css?v=1">
  <script src="/static/login.js?v=2" defer></script>
</head>
<body>
  <header class="account-toolbar"><a href="/courses">← 返回课程书架</a><button id="themeButton" aria-label="切换到深色模式"></button></header>
  <main class="account-shell">
    <section class="account-intro">
      <a class="brand" href="/courses">PLIAC<span>个性化学习工作台</span></a>
      <h1>接着上次的地方学</h1>
      <p class="intro-copy">登录后，保存你的学习进度、专属路线和与助手的对话。</p>
    </section>
    <section class="account-card" aria-labelledby="formTitle">
      <h2 id="formTitle">登录学习空间</h2>
      <p id="formDescription">学习进度、对话与画像按账号保存。</p>
      <div class="account-tabs" role="tablist" aria-label="账号操作">
        <button type="button" id="loginTab" role="tab" aria-selected="true">登录</button>
        <button type="button" id="registerTab" role="tab" aria-selected="false">创建账号</button>
      </div>
      <form id="accountForm">
        <label>账号<input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" required placeholder="你的账号"></label>
        <label id="displayNameRow" hidden>显示名称<input id="displayName" name="display_name" autocomplete="nickname" maxlength="80" placeholder="希望助手如何称呼你"></label>
        <label>密码<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="至少 8 个字符"></label>
        <p id="accountError" role="alert"></p>
        <button id="submitAccount" class="primary" type="submit">登录并继续</button>
      </form>
    </section>
  </main>
</body>
</html>
