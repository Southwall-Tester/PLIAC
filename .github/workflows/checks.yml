name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 -m unittest discover -s tests -p "test_*.py"
      - run: python -X utf8 scripts/check_assets.py
      - run: python -X utf8 scripts/benchmark_scanned_graph.py --verify-only
      - run: node --check static/app.js
      - run: node --check static/network-view.js
      - run: node --check static/network-pixi.js
      - run: node --check static/theme.js
      - run: node --check static/network-layout.js
      - run: node --check static/graph-encoding.js
      - run: node --check static/documents.js
      - run: node --check static/courses.js
      - run: node --check static/learning-home.js
      - run: node --check static/learning.js
      - run: node --check static/document-subgraphs.js
      - run: node --check static/ml-lab.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -X utf8 tests/test_ui_v7.py
      - run: python -X utf8 tests/test_ui_books.py
      - run: python -X utf8 tests/test_ui_network.py
      - run: python -X utf8 tests/test_ui_documents.py
      - run: python -X utf8 tests/test_ui_documents_performance.py
      - run: python -X utf8 tests/test_ui_gpu_graph.py
      - run: python -X utf8 tests/test_ui_courses.py
      - run: python -X utf8 tests/test_ui_text_hierarchy.py
      - run: python -X utf8 tests/test_ui_learning.py
      - run: python -X utf8 tests/test_ui_acceptance_course.py
      - run: python -X utf8 tests/test_ui_document_subgraphs.py
      - run: python -X utf8 tests/test_ui_ml_lab.py
      - run: python -X utf8 tests/test_ui_course_home.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-verification
          path: outputs/verification/
